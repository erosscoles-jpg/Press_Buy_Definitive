<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/regiLog.css">
    <title>Registrar - Press Buy</title>
</head>
<body>
    <!-- HEADER -->
    <header>
        <nav id="navbar">
            <div id="navbar-inner">
                <a href="/index.html" class="brand"><span class="dot"></span>Press Buy</a>
                <ul id="navbar-links">
                    <li><a href="/paginas/index.html">Home</a></li>
                    <li><a href="/paginas/perfil.html">Perfil</a></li>
                    <li><a href="/paginas/config.html">Configurações</a></li>
                </ul>
                <button class="nav-toggle" aria-label="Abrir menu"><span></span><span></span><span></span></button>
            </div>
        </nav>
    </header>

    <main>
        <div class="login-container">
            <h2>Registrar</h2>
            <form>
                <!-- NOME -->
                <div class="box-input">
                    <label for="name">
                        Nome <span class="required-field">*</span>
                    </label>

                    <input
                        type="text"
                        name="name"
                        id="name"
                        class="block"
                        placeholder="Seu nome"
                        minlength="1"
                        maxlength="30"
                        required>
                </div>

                <!-- EMAIL -->
                <div class="box-input">
                    <label for="email">
                        Email <span class="required-field">*</span>
                    </label>

                    <input
                        type="email"
                        name="email"
                        id="email"
                        class="block"
                        placeholder="Email"
                        minlength="1"
                        maxlength="30"
                        required>
                </div>

                <!-- SENHA -->
                <div class="box-input">
                    <label for="password">
                        Senha <span class="required-field">*</span>
                    </label>

                    <input
                        type="password"
                        name="password"
                        id="password"
                        class="block"
                        placeholder="senha"
                        minlength="1"
                        maxlength="30"
                        required>
                </div>

                <!-- CONFIRMAR SENHA -->
                <div class="box-input">
                    <label for="confpassword">
                        Confirmar Senha <span class="required-field">*</span>
                    </label>

                    <input
                        type="password"
                        name="confpassword"
                        id="confpassword"
                        class="block"
                        placeholder="Confirmar senha"
                        minlength="1"
                        maxlength="30"
                        required>
                </div>

                <input type="submit" value="Registrar">
            </form>

            <p class="auth-switch">Já tem conta? <a href="/paginas/login.html">Entrar</a></p>
        </div>
    </main>
</body>
</html>
