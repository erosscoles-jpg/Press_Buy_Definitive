<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/regiLog.css">
    <title>Redefinir senha - Press Buy</title>
</head>
<body>
    <!-- HEADER -->
    <header>
        <nav id="navbar">
            <div id="navbar-inner">
                <a href="/index.html" class="brand"><span class="dot"></span>Press Buy</a>
                <ul id="navbar-links">
                    <li><a href="/index.html">Home</a></li>
                    <li><a href="/index.html#catalogo">Catálogo</a></li>
                    <li><a href="/paginas/perfil.html">Perfil</a></li>
                    <li><a href="/paginas/config.html">Configurações</a></li>
                </ul>
                <button class="nav-toggle" aria-label="Abrir menu"><span></span><span></span><span></span></button>
            </div>
        </nav>
    </header>

    <main>
        <div class="login-container">
            <h2>Redefinir senha</h2>
            <p class="auth-sub">Crie uma nova senha para a sua conta. Depois de salvar, você poderá entrar normalmente com ela.</p>

            <form>
                <!-- NOVA SENHA -->
                <div class="box-input">
                    <label for="password">
                        Nova senha <span class="required-field">*</span>
                    </label>

                    <input
                        type="password"
                        name="password"
                        id="password"
                        class="block"
                        placeholder="Mínimo de 6 caracteres"
                        minlength="6"
                        maxlength="30"
                        required>
                </div>

                <!-- CONFIRMAR NOVA SENHA -->
                <div class="box-input">
                    <label for="confpassword">
                        Confirmar nova senha <span class="required-field">*</span>
                    </label>

                    <input
                        type="password"
                        name="confpassword"
                        id="confpassword"
                        class="block"
                        placeholder="Repita a nova senha"
                        minlength="6"
                        maxlength="30"
                        required>
                </div>

                <input type="submit" value="Salvar nova senha">
            </form>

            <p class="auth-switch">Mudou de ideia? <a href="/paginas/login.html">Voltar para o login</a></p>
        </div>
    </main>
</body>
</html>
