<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/regiLog.css">
    <title>Recuperar senha - Press Buy</title>
</head>
<body>
    <!-- HEADER -->
    <header>
        <nav id="navbar">
            <div id="navbar-inner">
                <a href="/index.html" class="brand"><span class="dot"></span>Press Buy</a>
                <ul id="navbar-links">
                    <li><a href="/paginas/index.html">Home</a></li>
                    <li><a href="/paginas/perfil.html">Perfil</a></li>
                    <li><a href="/paginas/config.html">Configurações</a></li>
                </ul>
                <button class="nav-toggle" aria-label="Abrir menu"><span></span><span></span><span></span></button>
            </div>
        </nav>
    </header>

    <main>
        <div class="login-container">
            <h2>Recuperar senha</h2>
            <p class="auth-sub">Digite o e-mail cadastrado na sua conta. Vamos enviar um link para você criar uma nova senha.</p>

            <form>
                <!-- EMAIL -->
                <div class="box-input">
                    <label for="email">
                        Email <span class="required-field">*</span>
                    </label>

                    <input
                        type="email"
                        name="email"
                        id="email"
                        class="block"
                        placeholder="seu@email.com"
                        minlength="1"
                        maxlength="60"
                        required>
                </div>

                <input type="submit" value="Enviar link de recuperação">
            </form>

            <p class="auth-switch">Lembrou a senha? <a href="/paginas/login.html">Voltar para o login</a></p>
        </div>
    </main>
</body>
</html>
